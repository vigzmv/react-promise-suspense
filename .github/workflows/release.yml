name: Release

on:
  push:
    tags: ["v*"]

# npm Trusted Publishing: the OIDC token is the only credential, and npm
# attaches provenance automatically.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Bundles npm 11.5.1+, which trusted publishing requires.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json is at $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      # `npm ci` also builds the package via the `prepare` script.
      - run: npm ci
      - run: npm test
      - run: npm run test:types
      - run: npm publish
